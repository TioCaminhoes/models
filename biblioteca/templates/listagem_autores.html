<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Autores</h1>
    <ul>
        {% for author in autores %}
            <li>{{ author.name }} -- {{ author.nationality }}</li>
            <ul>
                {% for book in author.books.all %}
                    <li>{{ book.title }}</li>
                {% empty %}
                    <li>Sem livros</li>
                {% endfor %}
            </ul>
        {% empty %}
            <li>Nenhum autor cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
