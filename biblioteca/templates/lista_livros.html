<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Livros Disponíveis</h1>
    <ul>
        {% for livro in livros %}
            <li>{{ livro.title }} - <a href="{% url 'author_detail' livro.author.pk %}">{{ livro.author }}</a> ({{ livro.publication_year }}) Status: {{ livro.available }}</li>
        {% endfor %}
    </ul>
</body>
</html>
