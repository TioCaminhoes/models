<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir livro</title>
</head>
<body>
    <h1>Excluir livro</h1>

    <p>Tem certeza que deseja excluir "{{ book.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar</button>
    </form>

    <a href="{% url 'listar_livros' %}">Cancelar</a>
</body>
</html>
